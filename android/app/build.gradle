apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.talkingclock.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.talkingclock.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debuggable APK, no signing config needed — this is what
            // GitHub Actions builds automatically on every push
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // The PWA (index.html/app.js/styles.css/...) lives under
    // app/src/main/assets/www and is loaded straight from there by the
    // WebView in MainActivity — no bundler, no server, fully offline.
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.leanback:leanback:1.0.0'
}
